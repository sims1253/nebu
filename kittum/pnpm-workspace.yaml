# apps/server is a Python project (uv), so it is not a pnpm package.
packages:
  - apps/web
  - packages/*

allowBuilds:
  esbuild: true
  "@tsc-rs/typescript": true

# Versions follow t3code (pingdotgg/t3code) where both use a package.
catalog:
  "@effect/openapi-generator": 4.0.6
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.168.48
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@vitejs/plugin-react": 6.1.2
  effect: 4.0.6
  knip: 6.43.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: npm:@tsc-rs/typescript@0.8.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
