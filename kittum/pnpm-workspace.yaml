# apps/server is a Python project (uv), so it is not a pnpm package.
packages:
  - apps/web
  - packages/*

allowBuilds:
  esbuild: true
  "@tsc-rs/typescript": true

# Versions follow t3code (pingdotgg/t3code) where both use a package.
catalog:
  "@base-ui/react": 1.9.0
  "@effect/openapi-generator": 4.0.6
  "@fontsource-variable/ibm-plex-sans": 5.3.0
  "@legendapp/list": 3.7.0
  "@playwright/test": 1.64.1
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.168.48
  "@types/node": 26.6.5
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@vitest/browser-playwright": 5.0.5
  effect: 4.0.6
  knip: 6.43.0
  playwright: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  typescript: npm:@tsc-rs/typescript@0.8.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# One Vite: @vitest/browser-playwright must see Vite+ core, not a second vite.
overrides:
  vite: "catalog:"
