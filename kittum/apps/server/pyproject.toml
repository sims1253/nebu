[project]
name = "kittum-server"
version = "0.0.1"
description = "Kittum: auditable, AI-assisted systematic literature reviews"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Maximilian Scholz" }]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "rfc8785>=0.1.4",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "scipy>=1.18.1",
    "cryptography>=50.0.2",
    "pyrate-limiter>=4.5.1",
    "stamina>=26.1.0",
    "httpx2>=2.16.0",
    "pymupdf>=2.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "rispy>=0.10.0",
    "rapidfuzz>=3.14.6",
    "pydantic-ai-slim[openai]>=2.63.0",
    "janus-server",
    "pdf-inspector>=1.25.2",
]

[project.scripts]
kittum = "kittum.cli:main"

[project.optional-dependencies]
docling = [
    "docling>=2.143.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.92",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kittum"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
    "TID",    # flake8-tidy-imports
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
# Fakes implement interfaces whose arguments they do not need.
"**/testing.py" = ["ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads annotations at runtime.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "kittum.core.Record"]

[tool.ruff.lint.isort]
known-first-party = ["kittum"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a running Postgres at KITTUM_DATABASE_URL",
]

[tool.uv.sources]
janus-server = { path = "../../../janus/apps/server", editable = true }
