    - code: A
      text_de:
        Capivasertib in Kombination mit Fulvestrant ist indiziert zur Behandlung von erwachsenen
        Patienten mit Östrogenrezeptor(ER)-positivem, HER2-negativem, lokal fortgeschrittenem oder metastasiertem
        Mammakarzinom mit einer oder mehreren PIK3CA/AKT1/PTEN-Alterationen nach Rezidiv oder Progression
        der Erkrankung während oder nach einer endokrinen Therapie.
