    criteria:
      - id: RCT-E1
        slot: population
        text:
          de: Erwachsene mit Östrogenrezeptor(ER)-positivem, HER2-negativem, lokal fortgeschrittenem
            oder metastasiertem Mammakarzinom nach Rezidiv oder Progression während oder nach einer
            endokrinen Therapie.
          en:
            Adults with oestrogen receptor (ER)-positive, HER2-negative, locally advanced or metastatic
            breast cancer that recurred or progressed during or after endocrine therapy.
        decidable_at:
          - title_abstract
          - full_text
        applies_to:
          - RCT
        positive_examples:
          - Patients with HR-positive, HER2-negative advanced breast cancer that had relapsed or progressed
            on an aromatase inhibitor.
        negative_examples:
