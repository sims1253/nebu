outcomes:
  - id: os
    category: mortality
    name:
      de: Gesamtüberleben
      en: Overall survival
    definition:
      de: Zeit von der Randomisierung bis zum Tod jeglicher Ursache.
    rationale:
      de: In der VerfO des G-BA ausdrücklich als patientenrelevant genannt.
  - id: pfs
    category: morbidity
    name:
      de: Progressionsfreies Überleben
      en: Progression-free survival
    definition:
      de:
        Zeit von der Randomisierung bis zur Progression nach RECIST 1.1 (Beurteilung durch Prüfärztin
        oder Prüfarzt) oder bis zum Tod jeglicher Ursache.
    rationale:
      de:
        Vom pU als patientenrelevant begründet. IQWiG und G-BA werten das PFS nicht als eigenständig
        patientenrelevant; der Beschluss stellt es ergänzend dar.
  - id: symptoms_qlq_c30
    category: morbidity
    name:
      de: Symptomatik (EORTC QLQ-C30)
      en: Symptoms (EORTC QLQ-C30)
    definition:
      de:
        Symptomskalen und Einzelsymptome des EORTC QLQ-C30 Version 3.0; Zeit bis zur ersten Verschlechterung
        um mindestens 10 Punkte.
    rationale:
      de: Patientenberichtete Symptomatik.
  - id: symptoms_qlq_br23
    category: morbidity
    name:
      de: Symptomatik (EORTC QLQ-BR23)
      en: Symptoms (EORTC QLQ-BR23)
    definition:
      de:
        Symptomskalen des EORTC QLQ-BR23 (Nebenwirkungen der systemischen Therapie, Symptome im Brust-
        und Armbereich, Belastung durch Haarausfall); Zeit bis zur ersten Verschlechterung um mindestens
        10 Punkte.
    rationale:
      de: Patientenberichtete, brustkrebsspezifische Symptomatik.
  - id: health_status_eq5d_vas
    category: morbidity
    name:
      de: Gesundheitszustand (EQ-5D-5L VAS)
      en: Health status (EQ-5D-5L VAS)
    definition:
      de:
        Visuelle Analogskala des EQ-5D-5L (0 bis 100); Zeit bis zur ersten Verschlechterung um mindestens
        15 Punkte (15 % der Skalenspannweite).
    rationale:
      de: Patientenberichteter Gesundheitszustand.
  - id: qol_qlq_c30
    category: quality_of_life
    name:
      de: Gesundheitsbezogene Lebensqualität (EORTC QLQ-C30)
      en: Health-related quality of life (EORTC QLQ-C30)
    definition:
      de:
        Globaler Gesundheitsstatus und Funktionsskalen des EORTC QLQ-C30; Zeit bis zur ersten Verschlechterung
        um mindestens 10 Punkte.
    rationale:
      de: Gesundheitsbezogene Lebensqualität ist eine eigene Nutzendimension.
  - id: qol_qlq_br23
    category: quality_of_life
    name:
      de: Gesundheitsbezogene Lebensqualität (EORTC QLQ-BR23)
      en: Health-related quality of life (EORTC QLQ-BR23)
    definition:
      de:
        Funktionsskalen des EORTC QLQ-BR23 (Körperbild, sexuelle Aktivität, Freude an Sex, Zukunftsperspektive);
        Zeit bis zur ersten Verschlechterung um mindestens 10 Punkte.
    rationale:
      de: Brustkrebsspezifische Lebensqualität.
  - id: sae
    category: side_effects
    name:
      de: Schwerwiegende unerwünschte Ereignisse (SUE)
      en: Serious adverse events
    definition:
      de: SUE ab der ersten Dosis bis 30 (+7) Tage nach Ende der Studienbehandlung; MedDRA 25.0.
    rationale:
      de: Schwerwiegende Schäden der Behandlung.
  - id: severe_ae
    category: side_effects
    name:
      de: Schwere unerwünschte Ereignisse (CTCAE-Grad ≥ 3)
      en: Severe adverse events (CTCAE grade ≥ 3)
    definition:
      de: UE mit CTCAE-Grad ≥ 3 nach CTCAE Version 5.0.
    rationale:
      de: Schwere Schäden der Behandlung.
  - id: discontinuation_ae
    category: side_effects
    name:
      de: Therapieabbruch wegen unerwünschter Ereignisse
      en: Treatment discontinuation due to adverse events
    definition:
      de: Abbruch mindestens einer Wirkstoffkomponente wegen eines UE.
    rationale:
      de: Abbrüche zeigen nicht tolerierbare Schäden.
  - id: specific_ae
    category: side_effects
    name:
      de: Spezifische unerwünschte Ereignisse
      en: Specific adverse events
    definition:
      de:
        "UE von speziellem Interesse nach Kategorie (Grouped Term): Ausschlag, Hyperglykämie, nicht-infektiöse
        Diarrhö, Harnwegsinfektion, infektiöse Lungenentzündung, Verlängerung des QT-Intervalls; jeweils
        als UE, SUE und schwere UE."
    rationale:
      de: Bekannte Schäden der AKT-Inhibition.
