# Capivasertib (Truqap®) + fulvestrant: ER+/HER2- advanced breast cancer with PIK3CA/AKT1/PTEN
# alterations after endocrine therapy. G-BA procedure D-1110.
#
# Sources (public, read on 28.10.2026):
# - G-BA, Beschluss vom 03.04.2025 (BAnz AT 18.06.2025 B4): Anwendungsgebiet, Patientengruppen
#   a1, a2, b1, b2, and their zVT, verbatim.
#   https://g-ba.de/downloads/39-261-7143/2025-04-03_AM-RL-XII_Capivasertib_D-1110.pdf
# - IQWiG, Dossierbewertung A24-105 (23.12.2024): zVT footnotes (off-label use, ovarian
#   suppression), the zVT revision of 26.11.2024, and the study pool CAPItello-291 and FAKTION.
#   https://www.iqwig.de/download/a24-105_capivasertib_nutzenbewertung-35a-sgb-v_v1-0.pdf
# - AstraZeneca, Dossier Modul 4 A (Stand 30.09.2024): inclusion criteria E1 to E9 (Tabelle 4-3),
#   endpoints and their operationalization (Abschnitt 4.2.5.2, Tabelle 4-18), subgroups
#   (Abschnitt 4.2.5.5), and the searches of 31.07.2024 (Anhang 4-A1, 4-B1).
#   https://g-ba.de/downloads/92-975-8035/2024_09_30_Modul4A_Capivasertib.pdf
#
# The file uses the gba_amnog profile: questions are the Teilpopulationen, their comparators are
# the zVT options, and the dossier and Anwendungsgebiet live under the profile's extensions.
#
# Differences from the submitted dossier, so the file exercises every part of the schema:
# - The Teilpopulationen follow the G-BA's final four groups. The dossier still used the six
#   groups of the 24.04.2024 consultation (split by menopausal status).
# - The source plan adds the EMA Clinical Data portal, which the Modul 4 template of 18.11.2025
#   requires and the 2024 dossier did not search.
# - Topic IC (indirect comparison via a fulvestrant bridge, mode M2) is illustrative. The dossier
#   reported Abschnitt 4.3.2.1 as "nicht zutreffend".

