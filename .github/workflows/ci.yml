name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs; keep branch-push runs (they are the record).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript (format, lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: janus
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        # @janus/server is a Python workspace; its checks need uv and run in the python job.
      - run: bun run check --filter='!@janus/server'

  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: janus
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  python:
    name: Python (ruff format, ruff check, ty, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: janus/apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ty check src
      - run: uv run --no-sync pytest

  cohort-example:
    name: Cohort-report example (downloaded from public source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: janus/apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run --no-sync python scripts/fetch_cohort_example.py
      - run: uv run --no-sync pytest tests/test_downloaded_example.py -q

  browser:
    name: Browser (extraction and comparison workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JANUS_DATA_DIR: /tmp/janus-browser
    defaults:
      run:
        working-directory: janus
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: uv sync --project apps/server --extra dev
      - run: cd apps/web && bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            janus/apps/web/test-results
            janus/apps/web/playwright-report

  kittum-python:
    name: Kittum Python (ruff, ty, pytest with Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kittum
          POSTGRES_PASSWORD: kittum
          POSTGRES_DB: kittum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kittum" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      KITTUM_DATABASE_URL: postgresql://kittum:kittum@127.0.0.1:5432/kittum
    defaults:
      run:
        working-directory: kittum/apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ty check src
      - name: Migrate
        run: >-
          docker run --rm --network host -v "$PWD/db:/db"
          -e DATABASE_URL="postgres://kittum:kittum@127.0.0.1:5432/kittum?sslmode=disable"
          ghcr.io/amacneil/dbmate:2 --migrations-dir /db/migrations --no-dump-schema --wait up
      - run: uv run --no-sync pytest

  kittum-web:
    name: Kittum TypeScript (format, lint, typecheck, tests, knip, build, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kittum
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kittum/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: kittum/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Generated contracts match the server
        run: pnpm contracts:generate && git diff --exit-code -- packages/contracts

  kittum-e2e:
    name: Kittum end to end (Postgres 18, server, worker, workbench in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kittum
          POSTGRES_PASSWORD: kittum
          POSTGRES_DB: kittum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kittum" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      KITTUM_DATABASE_URL: postgresql://kittum:kittum@127.0.0.1:5432/kittum
    defaults:
      run:
        working-directory: kittum
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kittum/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: kittum/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: kittum/apps/server
      - name: Migrate
        working-directory: kittum/apps/server
        run: >-
          docker run --rm --network host -v "$PWD/db:/db"
          -e DATABASE_URL="postgres://kittum:kittum@127.0.0.1:5432/kittum?sslmode=disable"
          ghcr.io/amacneil/dbmate:2 --migrations-dir /db/migrations --no-dump-schema --wait up
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      # The AI judge replays the demo's recorded answers (KITTUM_JUDGE_BACKEND=demo, set by
      # e2e/stack.ts), so the run is deterministic and needs no model server.
      - run: pnpm --dir apps/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kittum-e2e-failures
          path: |
            kittum/apps/web/test-results
            kittum/apps/web/playwright-report
